name: publish

# Rebuilds the apt and dnf repositories from the latest release of every
# product in ./products and publishes them on GitHub Pages
# (https://packages.chrom.ar). A product's release workflow starts it,
# and so does a push to main; it can also be run by hand.

on:
  repository_dispatch:
    types: [release]
  push: # a change here republishes too
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write    # deploy the site
  id-token: write # prove the deploy comes from this workflow

# One publish at a time; a newer one wins.
concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y apt-utils createrepo-c rpm
      - name: Packages from the latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/download.sh "$RUNNER_TEMP/pkgs"
      - name: Build
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')
          KEY=$KEY scripts/build.sh "$RUNNER_TEMP/pkgs" site https://packages.chrom.ar
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
